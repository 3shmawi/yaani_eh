name: yaani_eh
description: "Explains cafe menus in plain Egyptian Arabic: photos, calories, prices and pronunciation."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_screenutil: ^5.9.3
  go_router: ^18.1.1
  intl: ^0.20.3
  liquid_glass_widgets: ^1.16.0
  package_info_plus: ^10.2.2
  posthog_flutter: ^5.58.0
  sentry_flutter: ^10.2.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
  mocktail: ^1.0.5
  sentry_dart_plugin: ^3.4.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  assets:
    - assets/fonts/PlusJakartaSans/LICENSE.txt
    - assets/fonts/ReadexPro/LICENSE.txt
    - assets/fonts/Phosphor/LICENSE.txt
  fonts:
    # Phosphor Icons (MIT), Regular + Fill — see lib/core/theme/app_icons.dart
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor/Phosphor-Fill.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-700.ttf
          weight: 700
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/ReadexPro/ReadexPro-400.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro/ReadexPro-500.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro/ReadexPro-600.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro/ReadexPro-700.ttf
          weight: 700
  generate: true
  uses-material-design: true

sentry:
  upload_debug_symbols: true
  upload_sources: true
  log_level: error
