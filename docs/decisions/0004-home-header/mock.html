  return `<div class="band"><div class="pattern"></div><div class="inner" style="position:relative">
      <div class="row">${titleBlock(false)}</div>
      <div style="height:calc(14px * var(--s))"></div>${search()}
    </div></div>
    <div class="content"><div style="max-width:${tablet ? '960px' : 'none'};margin-inline:auto">${wotd}<div class="h2 t-head">${T.sections}</div>${hub}</div></div>`;
}

function optionC() {
  const picker = (big) => `<div class="picker ${big ? 't-large' : 't-head'}">${T.secs[0][1]}${I.chevDown}</div>`;
  const band = `<div class="band"><div class="pattern"></div><div class="inner" style="position:relative">
      <div class="t-label" style="color:var(--on-header-muted)">${T.app}</div>
      ${picker(true)}
      <div style="height:calc(10px * var(--s))"></div>${search()}
      <div style="height:calc(10px * var(--s))"></div>${chips()}
    </div></div>
    <div class="content">${hero(ar ? 'من المشروبات النهارده' : 'Today in drinks', T.cards[5])}<div class="h2 t-head">${T.cat}</div>${cards(8)}</div>`;
  if (state === 'scrolled') {
    return `<div class="band slim"><div class="inner"><div class="row">${picker(false)}<div class="grow"></div><div class="iconbtn">${I.search}</div></div>${chips()}</div></div>
      <div class="content">${cards(8)}</div>`;
  }
  if (state === 'sheet') {
    return band + `<div class="scrim"></div><div class="sheet"><div class="grab"></div><div class="t-head" style="margin-bottom:8px;padding-inline:10px">${T.pickSection}</div>
      ${T.secs.map(([ic, nm, n], i) => `<div class="srow ${i ? '' : 'on'}"><div class="art">${I[ic]}</div><div class="col grow"><div class="t-head">${nm}</div><div class="t-cap muted">${n || `<span class="badge">${T.soon}</span>`}</div></div>${i ? '' : `<div style="width:24px;color:var(--brand)">${I.check}</div>`}</div>`).join('')}
    </div>`;
  }
  return band;
}

const body = { a: optionA, b: optionB, c: optionC }[opt]();
const showTabs = state !== 'sheet' && state !== 'section';
document.getElementById('app').innerHTML = `<div class="screen" style="width:${W}px;height:${H}px">
  <div class="status"><span>9:41</span><span>●●● ▮</span></div>${body}${showTabs ? tabbar() : ''}</div>`;
</script>
</body>
</html>
